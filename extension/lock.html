<!doctype html><meta charset="utf-8"><title>Locked</title>
<style>body{font:16px/1.5 -apple-system,system-ui;max-width:560px;margin:12vh auto;padding:0 24px;color:#222}h1{font-size:28px;margin:0 0 8px}code{background:#f3f3f3;padding:2px 6px;border-radius:4px}button{font:inherit;padding:10px 16px;border-radius:8px;border:1px solid #999;background:#fff;cursor:pointer;margin-right:8px}.p{font-size:48px;font-weight:700}</style>
<h1>Not now.</h1>
<p>Your task is <b id="task"></b>.</p>
<p class="p"><span id="p"></span> distraction</p>
<p id="title"></p>
<p><button id="wrong">This is on task (open it, teach the gate)</button><button id="back">Go back</button></p>
<script>
const q=new URLSearchParams(location.search);
document.getElementById("task").textContent=q.get("task");
document.getElementById("p").textContent=Math.round(q.get("p")*100)+"%";
document.getElementById("title").textContent=q.get("t")+" — "+q.get("u");
document.getElementById("back").onclick=()=>history.go(-2);
document.getElementById("wrong").onclick=async()=>{
  await fetch("http://127.0.0.1:8790/override",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:q.get("u"),title:q.get("t"),label:0.0,model_p:+q.get("p"),task:q.get("task")})});
  location.replace(q.get("u"));
};
</script>
