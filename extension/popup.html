<!doctype html><meta charset="utf-8"><style>body{font:14px -apple-system,system-ui;width:280px;padding:12px}input{width:100%;box-sizing:border-box;padding:6px}button{margin-top:8px;padding:6px 10px}</style>
<b>Habitect Gate</b><p>Stated task</p><input id="task"><button id="save">Set task</button>
<p id="last" style="color:#555"></p>
<script>
chrome.storage.local.get("last",({last})=>{if(last)document.getElementById("last").textContent=`last: ${Math.round(last.p*100)}% ${last.lock?"LOCK":"ok"} · ${last.ms} ms · ${last.title||last.url}`});
fetch("http://127.0.0.1:8790").then(r=>r.json()).then(s=>document.getElementById("task").value=s.task).catch(()=>document.getElementById("last").textContent="gate server offline");
document.getElementById("save").onclick=()=>fetch("http://127.0.0.1:8790/task",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({task:document.getElementById("task").value})}).then(()=>window.close());
</script>
