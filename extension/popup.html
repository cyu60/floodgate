<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your focus · Floodgate</title>
  <style>
    :root { color-scheme: light; --paper: #f6f6f3; --ink: #262623; --muted: #6b6b68; --line: #e3e3dc; --blue: #365edc; }
    * { box-sizing: border-box; }
    body { width: 360px; margin: 0; padding: 24px; background: var(--paper); color: var(--ink); font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    .brand { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 650; letter-spacing: -.35px; }
    .mark { display: grid; place-items: center; width: 29px; height: 29px; border-radius: 9px; background: var(--ink); color: var(--paper); }
    .eyebrow { margin: 28px 0 7px; color: var(--muted); font-size: 10px; font-weight: 650; letter-spacing: 1.5px; text-transform: uppercase; }
    h1 { margin: 0 0 24px; font-size: 29px; line-height: 1.12; font-weight: 600; letter-spacing: -1.15px; }
    label { display: block; margin-bottom: 8px; font-size: 12px; font-weight: 600; }
    textarea { display: block; width: 100%; min-height: 83px; padding: 12px 13px; resize: vertical; border: 1px solid #d6d8d0; border-radius: 12px; background: #fffefc; color: var(--ink); font: inherit; font-size: 14px; line-height: 1.5; box-shadow: 0 1px 2px #20211f03; }
    textarea::placeholder { color: #92958c; }
    textarea:focus { border-color: var(--blue); }
    .helper { margin: 8px 1px 15px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    button { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; min-height: 42px; padding: 10px 16px; border: 1px solid transparent; border-radius: 10px; background: var(--blue); color: #fff; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s, transform .15s; }
    button:hover { background: #1958bd; }
    button:active { transform: translateY(1px); }
    button:disabled { background: #7e9dcd; cursor: wait; }
    :focus-visible { outline: 3px solid #9dbfec; outline-offset: 3px; }
    #status { min-height: 18px; margin: 9px 1px 0; color: #435f40; font-size: 11px; line-height: 1.5; overflow-wrap: anywhere; }
    #status[data-tone="error"] { color: #9d463e; }
    .details { display: grid; gap: 17px; margin-top: 18px; padding-top: 19px; border-top: 1px solid var(--line); }
    .detail-heading { display: flex; align-items: center; gap: 6px; margin: 0 0 4px; color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: .55px; text-transform: uppercase; }
    .dot { width: 5px; height: 5px; border-radius: 50%; background: #a5a99f; }
    .dot[data-connected="true"] { background: #5f8062; }
    .detail-text { margin: 0; color: #50534c; font-size: 11px; line-height: 1.55; overflow-wrap: anywhere; }
    #last { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <header class="brand">
    <span class="mark" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 20 20" fill="none"><path d="M3 4h14M3 10h10M3 16h6" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"/></svg></span>
    Floodgate
  </header>
  <main>
    <p class="eyebrow">A little more intention</p>
    <h1>Make room for<br>what matters.</h1>
    <form id="focus-form">
      <label for="task">What are you working on?</label>
      <textarea id="task" rows="2" maxlength="1000" placeholder="Finish the launch presentation" aria-describedby="task-help" required></textarea>
      <p class="helper" id="task-help">New pages are checked against this focus.</p>
      <button id="save" type="submit">Save focus <span aria-hidden="true">↗</span></button>
    </form>
    <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
    <div class="details">
      <section aria-labelledby="memory-heading">
        <h2 class="detail-heading" id="memory-heading"><span class="dot" id="memory-dot" aria-hidden="true"></span> Personal memory</h2>
        <p class="detail-text" id="memory">Checking your connection…</p>
      </section>
      <section aria-labelledby="last-heading">
        <h2 class="detail-heading" id="last-heading">Latest check</h2>
        <p class="detail-text" id="last">Your next visit starts here.</p>
      </section>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
